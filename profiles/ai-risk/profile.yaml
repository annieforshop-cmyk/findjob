# ---- 职级 / 年限 / 匹配度闸门 ----
# AI 风险是新兴领域，岗位普遍不硬性写 8 年，所以年限放松、职级仍卡 manager 以上。
require_title_seniority: true   # 至少 manager/director/head/vp/lead 级
min_years: 4                    # JD 明确写 <2 年的初级岗才丢；4-13 年落区间加分
min_skill_hits: 2               # JD 至少命中你 2 个技能，避免只靠标题沾边

