label: AI Governance
section: "AI 治理 & 风险"     # 与 ai-risk 合并展示在同一板块

# ============================================================
#  AI Governance 精准检索（无需 OpenAI）
#  目标画像：有 business / 风控 / 审计 / 合规背景，去【推动】
#  responsible AI / AI 治理 的资深岗（manager–director–head 带），美国。
#  打分逻辑见 src/score.py 的 focus 路径：岗位必须"以 AI 治理为中心"
#  （focus 词进标题，或正文出现 ≥2 个 focus 词），再按业务背景信号加权。
# ============================================================

# ⭐ focus_terms：这个方向的"中心主题"。岗位必须真的围绕它，否则直接过滤。
# 只放 AI-explicit 的词——保证进邮件的都是真·AI 治理岗，不是顺嘴提一句 AI 的岗。
