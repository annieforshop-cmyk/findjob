# ---- 职级 / 年限 / 匹配度闸门（你的硬要求：至少 manager、6-8 年以上）----
# require_title_seniority: 标题必须是 manager/director/head/vp/lead 级——
#   直接丢掉 "Internal Auditor" / "Senior Auditor" 这类个人贡献者岗。
require_title_seniority: true
# min_years: JD 明确写"低于 4 年"（min_years-2）的初级岗直接丢；
#   写 6-15 年的正好落你区间，加分。JD 没写年限的，靠标题职级判断、保留。
min_years: 6
# min_skill_hits: JD 里至少要命中你 3 个技能，才算"要求和你有实质重合"，
#   否则只是标题沾边——丢。想更宽松改 2，更严改 4。
min_skill_hits: 3

exclude_keywords:
  - intern
  - internship
  - unpaid
  - entry level
  - staff accountant
  - bookkeeper
  - tax preparer
  - software engineer
  - security clearance required
  - ts/sci

min_score: 30

# ============================================================
#  ⭐ AI × 审计 交叉岗（你最想去的）
# ============================================================
# 你的独特之处不是"会审计"也不是"懂 AI"，是**两个都在做**：CPA + 10 年审计，
# 现在在投行主导 AI 治理框架。市面上同时要这两样的岗位极少，一旦出现，
# 竞争者远比纯审计岗少 —— 所以这类岗要顶到最前面。
#
# 判定：JD 必须**每一组都命中至少一个词**（不是命中任意一个就算）。
# 只顺嘴提一句 AI 的审计岗、或者只提一句 audit 的 AI 岗，都进不来。
combo_boost:
  - label: "AI × 审计"
    all_of:
      # 第 1 组：真的和 AI 有关
      - [ai, artificial intelligence, genai, generative ai, agentic ai,
         machine learning, ml model, large language model, llm,
         ai governance, responsible ai, ai risk, model risk, algorithmic]
      # 第 2 组：真的和审计/控制有关
      - [audit, internal audit, auditor, audit plan, control testing,
         sox, sarbanes-oxley, icfr, coso, internal controls, assurance,
         controls testing, audit committee]
    # ⭐ 在"内部审计"这个 feed 里，audit 满地都是、AI 才是区分点，
    #   所以要求 **AI 必须出现在标题里**（下标 0 = 上面第 1 组）。
    #   否则一个普通审计岗只要 JD 里顺嘴提两句 AI 就会被误判成交叉岗。
    title_groups: [0]
    points: 20          # 命中组合：+20
    title_points: 15    # 两边都写进标题（"AI Audit Manager"）：再 +15
