# ============================================================
#  findjob — 基础/共享配置（所有 profile 都继承这里）
#  方向相关的设置（target_titles / skills / jsearch.queries 等）
#  放在 profiles/<方向>/profile.yaml 里，会覆盖这里的同名项。
# ============================================================

# ---- 候选人画像（所有 profile 共享，喂给 LLM 做多维分析）------
# 让打分系统全面、多角度地判断"是否适合"，而不是只看 title 或关键词。
candidate:
  summary: >-
    Candidate has ~10 years total professional experience and ~8 years in
    banking / financial-services INTERNAL AUDIT, plus enterprise risk, compliance
    and (recent) AI governance / AI risk. CPA; MSA (Master of Accounting);
    studying for AIGP (candidate, in progress). Current TITLE is 'Director' at a
    major investment bank, but the REAL seniority band is roughly audit
    SENIOR MANAGER to Director — so judge roles by the described scope of work,
    not by the title word. Best fit: senior manager / director / VP-level roles
    in internal audit, AI governance, AI risk, model risk, and enterprise/tech
    risk, ideally at banks, asset managers, insurers, Big-4/consulting, or large
    regulated tech companies. Authorized to work in the US and does NOT need
    visa sponsorship. Open to REMOTE, HYBRID, or ONSITE anywhere in the United
    States — location is fine as long as the role is US-based (if a posting lists
    multiple locations and any are in the US, that is acceptable). Not open to
    non-US-only roles. Hands-on with GenAI tools (Copilot, Claude Code, ChatGPT,
    Gemini) and agentic AI workflows.
  years_total: 10
  years_bank_internal_audit: 8
  work_authorization: US authorized, no sponsorship needed

# ---- 职业战略（Career Strategy）------------------------------
# 每个岗位除了"现在匹配"，还会按这个 3-5 年目标打 career_path_fit 分：
# 这份工作是不是通往目标的垫脚石（品牌、scope、轨迹），而不只是当前薪资。
career_goal: >-
  In 3-5 years, become Head / Director of AI Governance (or Chief AI Risk /
  AI Assurance leader) at a major bank, asset manager, or AI-forward regulated
  company. Roles that build toward this: owning AI governance frameworks,
  leading responsible-AI programs, AI risk/model-risk leadership, and audit
  leadership with a heavy AI mandate. Prefer brand-name regulated institutions
  and roles with executive visibility over small lateral pay bumps.

# ---- Fit Score v2 复合评分权重（总和不必等于1，会归一化）-------
fit_weights:
  overall: 0.20          # LLM 综合判断
  skills: 0.16           # 技能/内容契合
  seniority: 0.08        # 职级契合
  industry: 0.10         # 行业契合（银行/金融/受监管行业加分）
  leadership: 0.06       # 领导力 scope 契合
  ai_governance: 0.10    # AI 治理相关度
  career_path: 0.12      # ⭐ 是否通往 3-5 年目标（Head of AI Governance）
  growth: 0.05           # 成长空间
  comp: 0.05             # 薪资吸引力
  recruiter_odds: 0.08   # 现实回复概率（避免全投神仙岗）
# 另有稳定性调整：裁员风险 low +3 / high -8（见 src/ai_score.py）

# ---- 每日 Career Brief（一封邮件管所有事）---------------------
brief:
  primary_profile: ai-governance  # dream 岗位用哪个 profile 的简历评分
  top_jobs: 50          # Top Jobs 数量（跨三个方向合并去重后，公司多样性优先）
  per_company_cap: 3    # Top Jobs 里同一家公司最多出现几次（防刷屏）
  dream_per_company: 3  # Dream 栏目里同一家公司最多出现几次
  dream_max: 12         # dream 官网新岗每天最多精评几个
  research_top: 3       # 自动尽调几家公司（缓存14天，不重复花钱）
  networking_top: 4     # 为前几个岗位生成内推人选链接
  weekly_day: 0         # 周几做每周动作（0=周一：LinkedIn 内容 + recruiter 周计划）

# 只保留最终排名分 >= 这个阈值的岗位（0-100）。可被 profile 覆盖。
min_score: 30

# 每个方向每天邮件里最多展示多少个岗位
top_n: 40

# 只推送"今天新出现"的岗位（跨天去重，每个 profile 独立）
new_only: true

remote_only: false          # 你是资深岗，未必只看 remote；按需在 profile 里覆盖
locations:
  - united states
  - new york
  - remote

# ---- LLM 语义打分（像人一样读 JD 内容，不看 title）----------
ai_scoring:
  enabled: true
  model: gpt-4o-mini
  max_candidates: 60
  prefilter_min_score: 8

# 每天给最匹配的前 N 个岗位自动生成 cover letter 草稿附在邮件里（0=关闭）
auto_tailor_top: 0

# ---- 数据源 -------------------------------------------------
sources:
  remoteok: false           # 偏技术岗，和你方向关系不大，默认关
  remotive: false
  arbeitnow: false
  weworkremotely: false
  jobicy: false
  hackernews: false
  adzuna: true              # 第二聚合源，需 ADZUNA_APP_ID / ADZUNA_APP_KEY（免费）
  jsearch: true             # ⭐ 主力：Google-for-Jobs 聚合 LinkedIn/Indeed/Glassdoor/ZipRecruiter/Ladders/BuiltIn/Dice/Wellfound，需 RAPIDAPI_KEY

# JSearch 默认参数（queries 在各 profile 里定义）
jsearch:
  num_pages: 1
  date_posted: week

adzuna:
  country: us
  results_per_page: 50
