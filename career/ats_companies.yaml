# ============================================================
#  ATS 直连公司清单 — src/sources/ats_boards.py 每天自动抓取
#  不需要任何 API key：这些都是各公司招聘系统的公开接口。
#
#  kind: greenhouse | lever | ashby | smartrecruiters | workday
#    - greenhouse/lever/ashby/smartrecruiters: 需要 token
#    - workday: 需要 host + site（用搜索词查询，见 ats_boards.py）
#
#  verified: 2026-07-18 = 当天真实抓到过岗位的接口
#  接口失效会在每日日志里提示 "[ats:公司名] FAILED"，改这里即可。
#  这份清单和 dream_companies.yaml 独立：dream 是"梦想公司精评"，
#  这里是"广撒网"——两者岗位最终都会被 AI 按简历逐条打分。
# ============================================================

